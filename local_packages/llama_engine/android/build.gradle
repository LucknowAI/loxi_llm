group = "dev.lokillm.llama_engine"
version = "0.1.0"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "dev.lokillm.llama_engine"
    compileSdk = 35
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        minSdk = 24

        ndk {
            // 64-bit ARM only (modern Android devices).
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions -frtti -O3'
                arguments '-DANDROID_STL=c++_shared',
                          '-DANDROID_PLATFORM=android-24',
                          '-DCMAKE_BUILD_TYPE=Release',
                          // One CPU library per ARM feature level; ggml loads the best one the
                          // phone supports at startup, so older CPUs never run instructions
                          // they lack.
                          '-DGGML_BACKEND_DL=ON',
                          '-DGGML_CPU_ALL_VARIANTS=ON'
                // tools/mtmd/CMakeLists.txt also defines several CLI/debug
                // executables we don't want (llama-mtmd-cli, llama-mtmd-debug,
                // llama-llava-cli, etc.) — some need common/arg.h, which we
                // don't build. Restrict Gradle to only what we actually ship;
                // llama_engine_jni's own link deps (llama, mtmd) still build
                // as transitive targets.
                //
                // The ggml CPU variants are loaded at runtime (nothing links them), so
                // they must be listed here or Gradle neither builds nor packages them.
                // Names come from ggml/CMakeLists.txt (GGML_CPU_ALL_VARIANTS, Android).
                targets 'llama_engine_jni',
                        'ggml-cpu-android_armv8.0_1',
                        'ggml-cpu-android_armv8.2_1',
                        'ggml-cpu-android_armv8.2_2',
                        'ggml-cpu-android_armv8.6_1',
                        'ggml-cpu-android_armv9.0_1',
                        'ggml-cpu-android_armv9.2_1',
                        'ggml-cpu-android_armv9.2_2'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }
}
